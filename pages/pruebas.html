    <!--Banner videos-->
    <section class="home-section">
        <div id="myCarousel2" class="carousel slide mb-6">
  
            <!--Botones de desplazamineto-->
            <div class="carousel-indicators">
              <button type="button" data-bs-target="#myCarousel2" data-bs-slide-to="0" class="active" aria-label="Slide 1" aria-current="true"></button>
              <button type="button" data-bs-target="#myCarousel2" data-bs-slide-to="1" aria-label="Slide 2" class=""></button>
            </div>
  
            <!--Elementos dentro del banner-->
            <div class="carousel-inner">

                  </div>
  
                  <div class="col-xxl-4 col-xl-5 col-lg-12 col-md-12 col-sm-12 col-xs-12">
                    <ul class="s3-list">
  
                      <li>
                        <h4 id="video-title" class="video__name"></h4>
                      </li>

                      <li>
                        <p class="description" id="description" id="video-description"></p>
                      </li>

                      <div class="d-flex flex-row gap-3 mb-3">
                        
                        <li class="d-flex justify-content-center align-items-center gap-1">
                          <i class="fa-solid fa-thumbs-up mb-1"></i>
                          <p id="views"></p>             
                        </li>
  
                        <li class="d-flex justify-content-center align-items-center gap-1">
                          <i class="fa-solid fa-eye mb-1"></i>
                          <p id="likes"></p>
                        </li>

                      </div>
  
                      <li>
                        <button type="button" class="btn btn-success v-boton">Ver video completo</button>
                      </li>
  
                    </ul>
                  </div>
                </article>
